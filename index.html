<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kiosque</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #000;
    color: #fafafa;
  }

  /* Mascara da faixa que nao aparece na tela. Nada aqui dentro. */
  #barra {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 6.5vh;
    background: #000;
    z-index: 10;
  }

  /* Area util: tudo abaixo da mascara */
  #camera {
    position: fixed;
    top: 6.5vh;
    left: 0;
    width: 100%;
    height: 93.5vh;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #video {
    width: 100%;
    height: 100%;
    object-fit: contain;   /* mostra o quadro inteiro, sem cortar */
    display: block;
  }
  #video.oculto { display: none; }

  #mensagem {
    position: absolute;
    padding: 16px 20px;
    font-size: 15px;
    line-height: 1.5;
    color: #a1a1aa;
    text-align: center;
    max-width: 70%;
  }
  #mensagem strong { color: #fafafa; display: block; margin-bottom: 6px; }
  #mensagem.oculto { display: none; }

  /* Botoes de energia — canto inferior esquerdo, na area visivel */
  #energia {
    position: fixed;
    left: 16px;
    bottom: 16px;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .btn-energia {
    background: rgba(39, 39, 42, .85);
    color: #fafafa;
    border: 1px solid #52525b;
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
    backdrop-filter: blur(4px);
  }
  .btn-energia:hover { background: rgba(63, 63, 70, .95); }
  .btn-energia.perigo { background: #dc2626; border-color: #ef4444; }
  .btn-energia.perigo:hover { background: #b91c1c; }
  #aviso {
    color: #fca5a5;
    font-size: 14px;
    font-weight: 600;
    background: rgba(0, 0, 0, .7);
    padding: 6px 10px;
    border-radius: 6px;
  }
  #status {
    position: fixed;
    right: 16px;
    bottom: 16px;
    z-index: 20;
    font-size: 13px;
    color: #a1a1aa;
  }
</style>
</head>
<body>

<div id="barra"></div>

<div id="camera">
  <img id="video" class="oculto" alt="Webcam">
  <div id="mensagem"><strong>Conectando à câmera…</strong></div>
</div>

<div id="energia">
  <span id="aviso" hidden></span>
  <button class="btn-energia" id="btn-desligar">Desligar</button>
  <button class="btn-energia" id="btn-reiniciar">Reiniciar</button>
  <button class="btn-energia perigo" id="btn-confirmar" hidden>Confirmar</button>
  <button class="btn-energia" id="btn-cancelar" hidden>Cancelar</button>
</div>

<div id="status"></div>

<script>
  // Se a pagina for aberta como file://, uma URL relativa viraria
  // file:///cam. Nesse caso fala com o servidor local direto.
  const API = location.protocol === 'file:' ? 'http://localhost:8000' : '';

  /* ---------- webcam ---------- */
  const video    = document.getElementById('video');
  const mensagem = document.getElementById('mensagem');

  function mostrarVideo() {
    video.classList.remove('oculto');
    mensagem.classList.add('oculto');
  }

  function mostrarMensagem(titulo, detalhe) {
    video.classList.add('oculto');
    mensagem.classList.remove('oculto');
    mensagem.innerHTML = '<strong></strong><span></span>';
    mensagem.querySelector('strong').textContent = titulo;
    mensagem.querySelector('span').textContent = detalhe || '';
  }

  function conectarCamera() {
    // O cache-buster evita o navegador reaproveitar um stream ja morto.
    video.src = API + '/cam?t=' + Date.now();
  }

  video.addEventListener('load', mostrarVideo);

  video.addEventListener('error', async () => {
    let detalhe = 'O server.py está rodando?';
    try {
      const r = await fetch(API + '/api/cam');
      const dados = await r.json();
      if (dados.erro) detalhe = dados.erro;
    } catch (e) {}
    mostrarMensagem('Sem imagem da câmera', detalhe);
    setTimeout(conectarCamera, 3000);   // tenta de novo sozinho
  });

  conectarCamera();

  /* ---------- desligar / reiniciar ---------- */
  const btnDesligar  = document.getElementById('btn-desligar');
  const btnReiniciar = document.getElementById('btn-reiniciar');
  const btnConfirmar = document.getElementById('btn-confirmar');
  const btnCancelar  = document.getElementById('btn-cancelar');
  const aviso        = document.getElementById('aviso');
  const status       = document.getElementById('status');

  let acao = null;          // 'poweroff' | 'reboot'
  let timerCancelar = null;

  function pedirConfirmacao(qual, texto) {
    acao = qual;
    aviso.textContent = texto;
    aviso.hidden = false;
    btnDesligar.hidden = btnReiniciar.hidden = true;
    btnConfirmar.hidden = btnCancelar.hidden = false;
    clearTimeout(timerCancelar);
    timerCancelar = setTimeout(resetar, 8000);   // cancela sozinho em 8s
  }

  function resetar() {
    acao = null;
    clearTimeout(timerCancelar);
    aviso.hidden = true;
    btnConfirmar.hidden = btnCancelar.hidden = true;
    btnDesligar.hidden = btnReiniciar.hidden = false;
  }

  async function executar() {
    const endpoint = acao === 'poweroff' ? '/api/poweroff' : '/api/reboot';
    const rotulo   = acao === 'poweroff' ? 'Desligando' : 'Reiniciando';
    resetar();
    status.textContent = rotulo + '...';
    try {
      const r = await fetch(API + endpoint, { method: 'POST' });
      const dados = await r.json();
      if (!r.ok || !dados.ok) {
        status.textContent = 'Falhou: ' + (dados.erro || r.status);
        return;
      }
    } catch (e) {
      status.textContent = 'Sem resposta do servidor — o server.py está rodando?';
      return;
    }
    // Se em ~3s a maquina ainda estiver de pe, o comando falhou: mostra o
    // motivo na tela (em modo kiosque nao da para abrir o console).
    setTimeout(async () => {
      try {
        const r = await fetch(API + '/api/erro');
        const dados = await r.json();
        if (dados.erro) status.textContent = 'Falhou: ' + dados.erro;
      } catch (e) {}
    }, 3000);
  }

  btnDesligar.addEventListener('click',  () => pedirConfirmacao('poweroff', 'Desligar o computador?'));
  btnReiniciar.addEventListener('click', () => pedirConfirmacao('reboot',   'Reiniciar o computador?'));
  btnConfirmar.addEventListener('click', executar);
  btnCancelar.addEventListener('click',  resetar);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') resetar(); });
</script>

</body>
</html>
