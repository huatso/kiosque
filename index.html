<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kiosque</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #f4f4f5;
    color: #18181b;
  }

  /* A div preta no topo da tela */
  #barra {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 6.5vh;         /* valor inicial, alterado via JS */
    background: #000;
    z-index: 10;
    /* Mascara da area que nao aparece na tela: nada aqui dentro. */
  }

  /* Botoes de energia — na area visivel, canto inferior esquerdo */
  #energia {
    position: fixed;
    left: 16px;
    bottom: 16px;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 8px;
    background: #fff;
    border: 1px solid #d4d4d8;
    border-radius: 10px;
    padding: 10px 12px;
    box-shadow: 0 6px 20px rgba(0,0,0,.15);
  }
  .btn-energia {
    background: #f4f4f5;
    color: #18181b;
    border: 1px solid #d4d4d8;
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn-energia:hover { background: #e4e4e7; }
  .btn-energia.perigo {
    background: #dc2626;
    border-color: #b91c1c;
    color: #fff;
  }
  .btn-energia.perigo:hover { background: #b91c1c; }
  #aviso { color: #b91c1c; font-size: 14px; font-weight: 600; }

  /* Painel de controle do vh */
  #painel {
    position: fixed;
    right: 16px;
    bottom: 16px;
    z-index: 20;
    background: #fff;
    border: 1px solid #d4d4d8;
    border-radius: 10px;
    padding: 14px 16px;
    box-shadow: 0 6px 20px rgba(0,0,0,.15);
    width: 260px;
  }
  #painel label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 8px;
  }
  #slider { width: 100%; }
  .linha { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  #campo {
    width: 80px;
    padding: 6px 8px;
    font-size: 14px;
    border: 1px solid #d4d4d8;
    border-radius: 6px;
  }
  .unidade { font-size: 13px; color: #52525b; }
  #pixels { font-size: 12px; color: #71717a; margin-top: 8px; }

  /* Conteudo empurrado para baixo da barra */
  #conteudo { padding: 24px; margin-top: 6.5vh; }
  #status { font-size: 13px; color: #71717a; min-height: 1.2em; }
</style>
</head>
<body>

<div id="barra"></div>

<div id="energia">
  <span id="aviso" hidden></span>
  <button class="btn-energia" id="btn-desligar">Desligar</button>
  <button class="btn-energia" id="btn-reiniciar">Reiniciar</button>
  <button class="btn-energia perigo" id="btn-confirmar" hidden>Confirmar</button>
  <button class="btn-energia" id="btn-cancelar" hidden>Cancelar</button>
</div>

<div id="conteudo">
  <h1>Conteúdo da página</h1>
  <p>Tecla <kbd>c</kbd> mostra/esconde o painel de ajuste da altura da div preta (<code>vh</code>).</p>
  <p id="status"></p>
</div>

<div id="painel">
  <label for="slider">Altura da div preta (vh)</label>
  <input type="range" id="slider" min="0" max="100" step="0.5" value="6.5">
  <div class="linha">
    <input type="number" id="campo" min="0" max="100" step="0.5" value="6.5">
    <span class="unidade">vh</span>
  </div>
  <div id="pixels"></div>
</div>

<script>
  /* ---------- altura da barra preta ---------- */
  const PADRAO   = 6.5;
  const barra    = document.getElementById('barra');
  const conteudo = document.getElementById('conteudo');
  const slider   = document.getElementById('slider');
  const campo    = document.getElementById('campo');
  const pixels   = document.getElementById('pixels');

  function aplicar(valor) {
    let v = parseFloat(valor);
    if (isNaN(v)) return;
    v = Math.min(100, Math.max(0, v));

    barra.style.height = v + 'vh';
    conteudo.style.marginTop = v + 'vh';

    slider.value = v;
    campo.value  = v;
    pixels.textContent = `${v}vh = ${(window.innerHeight * v / 100).toFixed(0)}px`;

    try { localStorage.setItem('kiosque-vh', v); } catch (e) {}
  }

  slider.addEventListener('input', e => aplicar(e.target.value));
  campo.addEventListener('input',  e => aplicar(e.target.value));
  window.addEventListener('resize', () => aplicar(slider.value));

  let inicial = PADRAO;
  try {
    const salvo = localStorage.getItem('kiosque-vh');
    if (salvo !== null) inicial = parseFloat(salvo);
  } catch (e) {}
  aplicar(inicial);

  /* ---------- desligar / reiniciar ---------- */
  const btnDesligar  = document.getElementById('btn-desligar');
  const btnReiniciar = document.getElementById('btn-reiniciar');
  const btnConfirmar = document.getElementById('btn-confirmar');
  const btnCancelar  = document.getElementById('btn-cancelar');
  const aviso        = document.getElementById('aviso');
  const status       = document.getElementById('status');

  let acao = null;          // 'poweroff' | 'reboot'
  let timerCancelar = null;

  // Se a pagina foi aberta como file://, uma URL relativa viraria
  // file:///api/poweroff. Nesse caso fala com o servidor local direto.
  const API = location.protocol === 'file:' ? 'http://localhost:8000' : '';

  function pedirConfirmacao(qual, texto) {
    acao = qual;
    aviso.textContent = texto;
    aviso.hidden = false;
    btnDesligar.hidden = btnReiniciar.hidden = true;
    btnConfirmar.hidden = btnCancelar.hidden = false;
    clearTimeout(timerCancelar);
    timerCancelar = setTimeout(resetar, 8000);   // cancela sozinho em 8s
  }

  function resetar() {
    acao = null;
    clearTimeout(timerCancelar);
    aviso.hidden = true;
    btnConfirmar.hidden = btnCancelar.hidden = true;
    btnDesligar.hidden = btnReiniciar.hidden = false;
  }

  async function executar() {
    const endpoint = acao === 'poweroff' ? '/api/poweroff' : '/api/reboot';
    const rotulo   = acao === 'poweroff' ? 'Desligando' : 'Reiniciando';
    resetar();
    status.textContent = rotulo + '...';
    try {
      const r = await fetch(API + endpoint, { method: 'POST' });
      const dados = await r.json();
      if (!r.ok || !dados.ok) {
        status.textContent = 'Falhou: ' + (dados.erro || r.status);
        return;
      }
    } catch (e) {
      status.textContent = 'Sem resposta do servidor — o server.py está rodando?';
      return;
    }
    // Se em ~3s a maquina ainda estiver de pe, o comando falhou: mostra o
    // motivo na tela (em modo kiosque nao da para abrir o console).
    setTimeout(async () => {
      try {
        const r = await fetch(API + '/api/erro');
        const dados = await r.json();
        if (dados.erro) status.textContent = 'Falhou: ' + dados.erro;
      } catch (e) {}
    }, 3000);
  }

  btnDesligar.addEventListener('click',  () => pedirConfirmacao('poweroff', 'Desligar o computador?'));
  btnReiniciar.addEventListener('click', () => pedirConfirmacao('reboot',   'Reiniciar o computador?'));
  btnConfirmar.addEventListener('click', executar);
  btnCancelar.addEventListener('click',  resetar);

  /* ---------- modo kiosque: tecla "c" mostra/esconde o painel ---------- */
  const painel = document.getElementById('painel');
  function mostrarPainel(mostrar) {
    painel.hidden = !mostrar;
    try { localStorage.setItem('kiosque-painel', mostrar ? '1' : '0'); } catch (e) {}
  }
  document.addEventListener('keydown', e => {
    if (e.key === 'c' || e.key === 'C') mostrarPainel(painel.hidden);
    if (e.key === 'Escape') resetar();
  });
  let painelVisivel = true;
  try {
    const salvo = localStorage.getItem('kiosque-painel');
    if (salvo !== null) painelVisivel = salvo === '1';
  } catch (e) {}
  mostrarPainel(painelVisivel);
</script>

</body>
</html>
