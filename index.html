<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kiosque — Ajuste da barra preta</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #f4f4f5;
    color: #18181b;
  }

  /* A div preta no topo da tela */
  #barra {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 20vh;          /* valor inicial, alterado via JS */
    background: #000;
    z-index: 10;
  }

  /* Painel de controle */
  #painel {
    position: fixed;
    right: 16px;
    bottom: 16px;
    z-index: 20;
    background: #fff;
    border: 1px solid #d4d4d8;
    border-radius: 10px;
    padding: 14px 16px;
    box-shadow: 0 6px 20px rgba(0,0,0,.15);
    width: 260px;
  }
  #painel label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 8px;
  }
  #slider { width: 100%; }
  .linha {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
  }
  #campo {
    width: 80px;
    padding: 6px 8px;
    font-size: 14px;
    border: 1px solid #d4d4d8;
    border-radius: 6px;
  }
  .unidade { font-size: 13px; color: #52525b; }
  #pixels { font-size: 12px; color: #71717a; margin-top: 8px; }

  /* Conteúdo da página empurrado para baixo da barra */
  #conteudo {
    padding: 24px;
    margin-top: 20vh;      /* acompanha a altura da barra */
  }
</style>
</head>
<body>

<div id="barra"></div>

<div id="conteudo">
  <h1>Conteúdo da página</h1>
  <p>Use o painel no canto inferior direito para ajustar a altura da div preta em <code>vh</code>.</p>
</div>

<div id="painel">
  <label for="slider">Altura da div preta (vh)</label>
  <input type="range" id="slider" min="0" max="100" step="0.5" value="20">
  <div class="linha">
    <input type="number" id="campo" min="0" max="100" step="0.5" value="20">
    <span class="unidade">vh</span>
  </div>
  <div id="pixels"></div>
</div>

<script>
  const barra    = document.getElementById('barra');
  const conteudo = document.getElementById('conteudo');
  const slider   = document.getElementById('slider');
  const campo    = document.getElementById('campo');
  const pixels   = document.getElementById('pixels');

  function aplicar(valor) {
    // limita entre 0 e 100
    let v = parseFloat(valor);
    if (isNaN(v)) return;
    v = Math.min(100, Math.max(0, v));

    barra.style.height = v + 'vh';
    conteudo.style.marginTop = v + 'vh';

    slider.value = v;
    campo.value  = v;

    pixels.textContent = `${v}vh = ${(window.innerHeight * v / 100).toFixed(0)}px`;

    // guarda o último valor usado
    try { localStorage.setItem('kiosque-vh', v); } catch (e) {}
  }

  slider.addEventListener('input', e => aplicar(e.target.value));
  campo.addEventListener('input',  e => aplicar(e.target.value));
  window.addEventListener('resize', () => aplicar(slider.value));

  // valor inicial (recupera o último, se houver)
  let inicial = 20;
  try {
    const salvo = localStorage.getItem('kiosque-vh');
    if (salvo !== null) inicial = parseFloat(salvo);
  } catch (e) {}
  aplicar(inicial);
</script>

</body>
</html>
